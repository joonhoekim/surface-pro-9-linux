# SPDX-License-Identifier: MIT
# Internal microphones (ALC274 pin 0x12, the only input of the PCH HDA card 00:1f.3).
#
# First-use gain. WirePlumber starts a source it has no stored route for at 100 %, which the
# ACP path analog-input-mic turns into Capture +30 dB plus Mic Boost +30 dB. At +60 dB a
# 1 kHz tone that reads -34 dBFS with the boost off clips, and the first second after the
# codec resumes sits at full scale (test AUD-3, docs/test-results.md).
# 0.0328 is 32 % on the cubic scale wpctl and volume controls show: Capture +30 dB, Mic Boost
# 0 dB (measured mapping: 32 % -> Capture 63, boost 0; 68 % -> boost 1; 100 % -> boost 3).
# This is the default of the route only. A volume the user sets is stored by WirePlumber
# (~/.local/state/wireplumber/default-routes) and wins from then on, also one stored before
# this rule existed.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.routes.default-source-volume = 0.0328
      }
    }
  }
]
