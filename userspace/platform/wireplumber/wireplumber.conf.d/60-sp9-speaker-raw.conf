# The internal speaker sink of the PCH HDA (00:1f.3) gets a fixed name so the
# "Speakers" filter chain (pipewire.conf.d/60-sp9-speakers.conf) can target
# it whatever the path: "analog-stereo" with the plain ALSA profile,
# "HiFi__Speaker__sink" with UCM (SOF or legacy HDA). It stays selectable but is never
# the default: priority below the filter sink.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.*.analog-stereo$" }
      { node.name = "~alsa_output.pci-0000_00_1f.3.*.HiFi__Speaker__sink$" }
    ]
    actions = {
      update-props = {
        node.name        = "sp9_speaker_raw"
        node.description = "Speakers (raw, unprocessed)"
        priority.session = 100
      }
    }
  }
]
