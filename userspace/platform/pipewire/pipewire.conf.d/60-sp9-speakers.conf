# SPDX-License-Identifier: MIT
# "Speakers": the Surface Render EFX chain Windows always runs on the internal
# speakers (docs/research/gaps/audio.md 1.5, gap G4). There is no smart amplifier, so
# this is the only speaker protection.
#   MainEQ: 2 x 2nd-order high-pass 50 Hz, peak -9 dB @ 3763 Hz Q 2.0,
#           peak -3 dB @ 2502 Hz Q 1.5, peak +3.7 dB @ 10.5 kHz Q 0.7
#   VolumeDepMBDRC4: crossovers 100/600 Hz (Linkwitz-Riley 4th order, the
#           high band gets the 100 Hz all-pass so the bands sum flat);
#           band 1 (<100 Hz) +4 dB, -6 dB, 2:1, release 20 ms;
#           band 2 (100-600 Hz) +4 dB, -5 dB, 1.7:1, release 10 ms;
#           bands 3-4 (>600 Hz, 2750 Hz split irrelevant) pass through.
#           sc4's shortest attack is 1.5 ms (Windows 1 ms); it has no hold.
#   OutputLimiter: -1 dBFS (Windows 0 dBFS; 1 dB for inter-sample peaks).
# Not reproduced: VolumeDepLS/VolumeDepHS (need the sink volume) and Crystal
# (dynamic limits at 160/240/455/644/844 Hz).
# Needs swh-plugins (LADSPA sc4, fastLookaheadLimiter). nofail: without them
# PipeWire still starts and the raw speaker sink remains.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speakers"
      media.name       = "Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = hp1L label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = hp2L label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = pk1L label = bq_peaking control = { "Freq" = 3763.0 "Q" = 2.0 "Gain" = -9.0 } }
          { type = builtin name = pk2L label = bq_peaking control = { "Freq" = 2502.0 "Q" = 1.5 "Gain" = -3.0 } }
          { type = builtin name = pk3L label = bq_peaking control = { "Freq" = 10500.0 "Q" = 0.7 "Gain" = 3.7 } }
          { type = builtin name = lo600aL label = bq_lowpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = lo600bL label = bq_lowpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = hi600aL label = bq_highpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = hi600bL label = bq_highpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = lo100aL label = bq_lowpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = lo100bL label = bq_lowpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = hi100aL label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = hi100bL label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = ap100L label = bq_allpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = pre1L label = mixer control = { "Gain 1" = 1.585 } }
          { type = builtin name = pre2L label = mixer control = { "Gain 1" = 1.585 } }
          { type = builtin name = sumL label = mixer }
          { type = builtin name = hp1R label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = hp2R label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = pk1R label = bq_peaking control = { "Freq" = 3763.0 "Q" = 2.0 "Gain" = -9.0 } }
          { type = builtin name = pk2R label = bq_peaking control = { "Freq" = 2502.0 "Q" = 1.5 "Gain" = -3.0 } }
          { type = builtin name = pk3R label = bq_peaking control = { "Freq" = 10500.0 "Q" = 0.7 "Gain" = 3.7 } }
          { type = builtin name = lo600aR label = bq_lowpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = lo600bR label = bq_lowpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = hi600aR label = bq_highpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = hi600bR label = bq_highpass control = { "Freq" = 600.0 "Q" = 0.707 } }
          { type = builtin name = lo100aR label = bq_lowpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = lo100bR label = bq_lowpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = hi100aR label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = hi100bR label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = ap100R label = bq_allpass control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = pre1R label = mixer control = { "Gain 1" = 1.585 } }
          { type = builtin name = pre2R label = mixer control = { "Gain 1" = 1.585 } }
          { type = builtin name = sumR label = mixer }
          { type = ladspa name = band1 plugin = sc4_1882 label = sc4
            control = {
              "RMS/peak" = 0.0
              "Attack time (ms)" = 1.5
              "Release time (ms)" = 20
              "Threshold level (dB)" = -6
              "Ratio (1:n)" = 2.0
              "Knee radius (dB)" = 1
              "Makeup gain (dB)" = 0
            }
          }
          { type = ladspa name = band2 plugin = sc4_1882 label = sc4
            control = {
              "RMS/peak" = 0.0
              "Attack time (ms)" = 1.5
              "Release time (ms)" = 10
              "Threshold level (dB)" = -5
              "Ratio (1:n)" = 1.7
              "Knee radius (dB)" = 1
              "Makeup gain (dB)" = 0
            }
          }
          { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
            control = {
              "Input gain (dB)" = 0
              "Limit (dB)" = -1
              "Release time (s)" = 0.01
            }
          }
        ]
        links = [
          { output = "hp1L:Out" input = "hp2L:In" }
          { output = "hp2L:Out" input = "pk1L:In" }
          { output = "pk1L:Out" input = "pk2L:In" }
          { output = "pk2L:Out" input = "pk3L:In" }
          { output = "pk3L:Out" input = "lo600aL:In" }
          { output = "lo600aL:Out" input = "lo600bL:In" }
          { output = "pk3L:Out" input = "hi600aL:In" }
          { output = "hi600aL:Out" input = "hi600bL:In" }
          { output = "hi600bL:Out" input = "ap100L:In" }
          { output = "lo600bL:Out" input = "lo100aL:In" }
          { output = "lo100aL:Out" input = "lo100bL:In" }
          { output = "lo600bL:Out" input = "hi100aL:In" }
          { output = "hi100aL:Out" input = "hi100bL:In" }
          { output = "lo100bL:Out" input = "pre1L:In 1" }
          { output = "hi100bL:Out" input = "pre2L:In 1" }
          { output = "hp1R:Out" input = "hp2R:In" }
          { output = "hp2R:Out" input = "pk1R:In" }
          { output = "pk1R:Out" input = "pk2R:In" }
          { output = "pk2R:Out" input = "pk3R:In" }
          { output = "pk3R:Out" input = "lo600aR:In" }
          { output = "lo600aR:Out" input = "lo600bR:In" }
          { output = "pk3R:Out" input = "hi600aR:In" }
          { output = "hi600aR:Out" input = "hi600bR:In" }
          { output = "hi600bR:Out" input = "ap100R:In" }
          { output = "lo600bR:Out" input = "lo100aR:In" }
          { output = "lo100aR:Out" input = "lo100bR:In" }
          { output = "lo600bR:Out" input = "hi100aR:In" }
          { output = "hi100aR:Out" input = "hi100bR:In" }
          { output = "lo100bR:Out" input = "pre1R:In 1" }
          { output = "hi100bR:Out" input = "pre2R:In 1" }
          { output = "pre1L:Out" input = "band1:Left input" }
          { output = "pre2L:Out" input = "band2:Left input" }
          { output = "band1:Left output" input = "sumL:In 1" }
          { output = "band2:Left output" input = "sumL:In 2" }
          { output = "ap100L:Out" input = "sumL:In 3" }
          { output = "pre1R:Out" input = "band1:Right input" }
          { output = "pre2R:Out" input = "band2:Right input" }
          { output = "band1:Right output" input = "sumR:In 1" }
          { output = "band2:Right output" input = "sumR:In 2" }
          { output = "ap100R:Out" input = "sumR:In 3" }
          { output = "sumL:Out" input = "lim:Input 1" }
          { output = "sumR:Out" input = "lim:Input 2" }
        ]
        inputs  = [ "hp1L:In" "hp1R:In" ]
        outputs = [ "lim:Output 1" "lim:Output 2" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name        = "effect_input.sp9_speakers"
        media.class      = Audio/Sink
        priority.session = 1000
      }
      playback.props = {
        node.name         = "effect_output.sp9_speakers"
        node.passive      = true
        # renamed by wireplumber.conf.d/60-sp9-speaker-raw.conf
        target.object     = "sp9_speaker_raw"
        stream.dont-remix = true
      }
    }
  }
]
