# SPDX-License-Identifier: MIT
# "Speakers": protection for the internal speakers (docs/research/gaps/audio.md
# gap G4). There is no smart amplifier, so software processing is the only
# speaker protection. Every stage rests on a measurement of this device made
# with the built-in microphone (docs/research/gaps/audio.md G4):
#   High-pass: 2 x 2nd-order Butterworth at 50 Hz (4th-order Linkwitz-Riley,
#       -6 dB at 50 Hz). Below about 60 Hz the speakers return a fundamental
#       41-55 dB under the 400 Hz level, with THD 8-60 %.
#   Cut: peak -6 dB @ 3700 Hz Q 2.5. Each speaker alone has a rise between
#       3.4 and 4.2 kHz that peaks 7-8 dB above its 2.7 kHz level (left
#       3.6 kHz, right 4.0 kHz), and THD there is 3.5-9 % against 1-2 %.
#   Output limiter: -1 dBFS (1 dB margin for inter-sample peaks).
# Needs swh-plugins (LADSPA fastLookaheadLimiter). nofail: without them
# PipeWire still starts and the raw speaker sink remains.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speakers"
      media.name       = "Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = hp1L label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = hp2L label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = cutL label = bq_peaking control = { "Freq" = 3700.0 "Q" = 2.5 "Gain" = -6.0 } }
          { type = builtin name = hp1R label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = hp2R label = bq_highpass control = { "Freq" = 50.0 "Q" = 0.707 } }
          { type = builtin name = cutR label = bq_peaking control = { "Freq" = 3700.0 "Q" = 2.5 "Gain" = -6.0 } }
          { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
            control = {
              "Input gain (dB)" = 0
              "Limit (dB)" = -1
              "Release time (s)" = 0.01
            }
          }
        ]
        links = [
          { output = "hp1L:Out" input = "hp2L:In" }
          { output = "hp2L:Out" input = "cutL:In" }
          { output = "hp1R:Out" input = "hp2R:In" }
          { output = "hp2R:Out" input = "cutR:In" }
          { output = "cutL:Out" input = "lim:Input 1" }
          { output = "cutR:Out" input = "lim:Input 2" }
        ]
        inputs  = [ "hp1L:In" "hp1R:In" ]
        outputs = [ "lim:Output 1" "lim:Output 2" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name        = "effect_input.sp9_speakers"
        media.class      = Audio/Sink
        priority.session = 1000
      }
      playback.props = {
        node.name         = "effect_output.sp9_speakers"
        node.passive      = true
        # renamed by wireplumber.conf.d/60-sp9-speaker-raw.conf
        target.object     = "sp9_speaker_raw"
        stream.dont-remix = true
      }
    }
  }
]
