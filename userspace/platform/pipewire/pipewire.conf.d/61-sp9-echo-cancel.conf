# "Microphone (echo cancelled)": the internal microphones with the speaker signal removed
# (WebRTC AEC), for calls on the internal speakers. An application has to select it; it has no
# priority.session, so the default source stays the plain microphone and the default sink the
# "Speakers" filter sink.
#
# monitor.mode: the reference is taken from the monitor of the raw speaker sink, after the
# filter chain (60-sp9-speakers.conf), which is what the speakers actually play. Without it
# the module creates its own sink and only streams an application routes there are cancelled.
# The reference is the internal speakers only: on a headset there is nothing to cancel.
#
# capture target: the node name of the legacy HDA path with the ACP profile, which is how this
# device comes up. If the name differs (UCM, SOF) the capture stream stays unlinked and the
# source delivers silence.
# node.passive on both streams: otherwise they keep the codec out of runtime suspend while
# nobody records. state.restore-*: WirePlumber would otherwise re-apply a stored volume or
# target to these internal streams.
context.modules = [
  { name = libpipewire-module-echo-cancel
    flags = [ nofail ]
    args = {
      monitor.mode = true
      capture.props = {
        node.name            = "capture.sp9_echo_cancel"
        target.object        = "alsa_input.pci-0000_00_1f.3.analog-stereo"
        node.passive         = true
        state.restore-props  = false
        state.restore-target = false
      }
      source.props = {
        node.name        = "sp9_echo_cancel"
        node.description = "Microphone (echo cancelled)"
      }
      sink.props = {
        node.name            = "reference.sp9_echo_cancel"
        target.object        = "sp9_speaker_raw"
        node.passive         = true
        state.restore-props  = false
        state.restore-target = false
      }
    }
  }
]
