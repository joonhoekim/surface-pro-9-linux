# Surface Pro 9 (Intel) touch controller behind ITHC.
# Width/Height/Invert come from the device metadata (46x68, 27.389 x 18.259 cm,
# no inversion), so they are not set here.
[Device]
Vendor = 0x045E
Product = 0x0C52

[Touchscreen]
# Drop touch while the pen is in proximity (palm rejection stopgap).
DisableOnStylus = true

[Contacts]
ActivationThreshold = 24
DeactivationThreshold = 20
OrientationThresholdMax = 5

# The keys below need the iptsd patches of userspace/iptsd; a stock iptsd ignores them.

[Stylus]
# Stylus axes in 0.01 mm (27389 x 18259) instead of 9600 x 7200.
AxisResolution = 100

[DFT]
# Pen position from the two MPP v2 position windows of a frame: 133 samples per second instead
# of 67, and no offset when the pen is tilted.
ExtraPositionWindows = true

# Antenna grid of the panel: pitch and position of the first antenna, in mm.
AntennaPitchX = 4.07478
AntennaPitchY = 4.01578
AntennaOriginX = 0.44
AntennaOriginY = 0.94

# Tilt from the MPP v2 position windows; the ring electrode of the Slim Pen 2 is 9.098 mm up the pen.
# TiltSmoothing holds a steady tilt constant (follows changes of 5 degrees and more).
Mpp2TiltDistance = 0.9098
TiltSmoothing = true

# Position correction for a tilted pen, in antennas per antenna of tip-ring distance (and its square).
TiltOffsetLinear = 0.0402
TiltOffsetQuadratic = 0.0089

# Position between two antennas from the centroid of three antennas on both axes, with its error
# that repeats with the antenna pitch removed. The error follows the strength of the tip signal:
# TipSignalReference is the summed amplitude of three antennas with the tip resting lightly on the
# glass, the coefficients (in antennas) were fitted to slow straight diagonal strokes at signal
# levels 0.95 .. 1.85.
PositionCentroidX = true
PositionCentroidY = true
TipSignalReference = 3000
CellCorrectionLevelMin = 0.95
CellCorrectionLevelMax = 1.85
CellCorrectionCosX = 0.0108
CellCorrectionSinX = -0.0059
CellCorrectionCosLevelX = -0.1141
CellCorrectionSinLevelX = 0.0157
CellCorrectionCos2X = 0.0017
CellCorrectionSin2X = 0.0058
CellCorrectionCosY = 0.0124
CellCorrectionSinY = 0.0189
CellCorrectionCosLevelY = -0.0928
CellCorrectionSinLevelY = 0.0086
CellCorrectionCos2Y = 0.0009
CellCorrectionSin2Y = 0.0088

# A pen hovering high (less than half of the signal on the glass) takes the parabola: the centroid
# jumps there.
CentroidFadeMin = 0.5
CentroidFadeMax = 0.8

# Contact from the force tone of every position window; zero force contact needs 8 samples out of
# hover, ends at 85 % of the tip signal of the stroke, and is off for 50 samples after a firm stroke.
ForceToneContact = true
ZeroForceStartSamples = 8
ZeroForceStrokeLevel = 0.85
ZeroForceLockoutPressure = 0.22
ZeroForceLockoutSamples = 50

# Pressure from the tone and the digital bits of the pen, half steps between the two samples of a
# frame, and a pressure adapted to the last stroke starts for contact without force.
Mpp2PressureDecode = true
PressureRamp = true
ZeroForcePressure = true

# A pen resting on the glass keeps its position (mm, samples).
JitterRadius = 0.158
JitterCount = 6

# No button from other tones in the button window.
ButtonToneRatio = 3

# Not enabled: InkFilter (Kalman filter: half the roughness for 0.16 .. 0.24 mm of lag),
# TiltWhileHovering = false (no tilt while hovering), HoverJitterRadius.
