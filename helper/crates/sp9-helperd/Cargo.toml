[package]
name = "sp9-helperd"
description = "System D-Bus service for the device-specific controls of the Surface Pro 9 (Intel)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sp9-helper-core = { path = "../sp9-helper-core" }
zbus.workspace = true
async-io = "2"
blocking = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }
