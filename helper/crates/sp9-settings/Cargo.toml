[package]
name = "sp9-settings"
description = "GTK4/libadwaita settings app for sp9-helperd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# --version: the project version plus `git describe` for development builds
build = "../../version-build.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
zbus = { workspace = true, features = ["blocking-api"] }
serde.workspace = true
async-channel = "2"
