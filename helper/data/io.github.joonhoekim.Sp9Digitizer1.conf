<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only root runs the daemon, and only root (sp9-helperd, which asks polkit) changes its settings -->
  <policy user="root">
    <allow own="io.github.joonhoekim.Sp9Digitizer1"/>
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1"/>
  </policy>
  <!-- anyone may read: properties, the configuration in force, introspection -->
  <policy context="default">
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.joonhoekim.Sp9Digitizer1" send_interface="io.github.joonhoekim.Sp9Digitizer1.Diagnostics" send_member="GetConfig"/>
  </policy>
</busconfig>
