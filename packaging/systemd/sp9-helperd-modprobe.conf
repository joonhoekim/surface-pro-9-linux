# Packaged sp9-helperd: load the SSAM character device module before the daemon starts, so that
# smart charging and the fan request work right after the package is installed and not only after
# the next boot (modules-load.d/sp9-helper.conf covers the boot).
[Unit]
Wants=modprobe@surface_aggregator_cdev.service
After=modprobe@surface_aggregator_cdev.service
