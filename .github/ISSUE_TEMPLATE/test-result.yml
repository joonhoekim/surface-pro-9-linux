name: Test result
description: A run of a test from docs/test-plan.md on your unit, recorded the way docs/test-results.md records it
title: "Test result: "
labels: [test result]
body:
  - type: markdown
    attributes:
      value: |
        One test ID per issue; put the ID in the title. The definitions, the expected results and the record format are in the [test plan](https://github.com/joonhoekim/surface-pro-9-linux/blob/main/docs/test-plan.md#how-to-record).
        "The driver bound" or "the device node exists" is not evidence. Keep raw logs out of the issue unless you have checked them for addresses and serials; copy the values by hand.
  - type: input
    id: id
    attributes:
      label: ID
      description: The test ID from the plan, for example PEN-1
      placeholder: PEN-1
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "pass (same as the expected result)"
        - "partial"
        - "fail"
        - "unverified (could not be run)"
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence
      options:
        - "measured (logs, numbers, counters)"
        - "observed (a person saw, heard or felt it)"
        - "both"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "`uname -r`, and which of this repository's patches it carries (for example: 7.3.4, patches 0001-0026)"
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Config
      description: "Whatever affects the comparison: kernel parameters, module options, touch daemon (iptsd or sp9-digitizerd), filter chain present or not"
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Values, notes
      description: The numbers and what you saw. Repeated tests as N/M (for example resumed 9 times out of 10).
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: Unit
      description: "SKU (`cat /sys/class/dmi/id/product_sku`), UEFI version (`cat /sys/class/dmi/id/bios_version`), Type Cover and pen model if the test involves them"
    validations:
      required: true
