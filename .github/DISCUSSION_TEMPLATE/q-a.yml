body:
  - type: markdown
    attributes:
      value: |
        Check the [install guides](https://github.com/joonhoekim/surface-pro-9-linux/blob/main/docs/install.md) and [hardware status](https://github.com/joonhoekim/surface-pro-9-linux/blob/main/docs/hardware-status.md) first. Remove serial numbers, addresses and network names from anything you paste.
