#
# Licensing of every file in this repository (https://reuse.software). A file's own SPDX header
# and the entry here agree; where several entries match a path, the last one applies.

version = 1

# Tools, platform files, pen tools, Nix code, CI and repository metadata. The patches under
# userspace/iptsd/ and userspace/libcamera/ are not MIT: see their entries below.
[[annotations]]
path = [
  "tools/**", "userspace/**", "nix/**", ".github/**",
  "flake.nix", "flake.lock", ".gitignore", ".gitattributes", "NOTICE", "LICENSE", "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Joonhoe Kim"
SPDX-License-Identifier = "MIT"

# Device helper (sp9-helperd, sp9-ctl, sp9-settings), the touch and pen daemon (sp9-digitizer,
# sp9-digitizerd), their data files and the lock file.
[[annotations]]
path = "helper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Joonhoe Kim"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Kernel config fragment.
[[annotations]]
path = "kernel/config/**"
SPDX-FileCopyrightText = "2026 Joonhoe Kim"
SPDX-License-Identifier = "GPL-2.0-only"

# Kernel patches. They are changes to the Linux kernel and carry its licence. Each patch names its
# author in From: and everyone who signed it off in Signed-off-by:; kernel/PROVENANCE.md records
# where 0001-0010 were taken from (upstream Linux and linux-surface/kernel pull requests).
# "override": a patch that adds a kernel source file contains that file's own SPDX line (0008 has
# the kernel's older spelling "GPL-2.0", the same licence), which is not a header of the patch file.
[[annotations]]
path = "kernel/patches/0001-*.patch"
precedence = "override"
SPDX-FileCopyrightText = "Sakari Ailus <sakari.ailus@linux.intel.com>"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "kernel/patches/0002-*.patch", "kernel/patches/0003-*.patch", "kernel/patches/0004-*.patch",
  "kernel/patches/0005-*.patch", "kernel/patches/0006-*.patch",
]
precedence = "override"
SPDX-FileCopyrightText = "Fernando Rimoli <fernandorimoli11@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "kernel/patches/0007-*.patch", "kernel/patches/0008-*.patch", "kernel/patches/0009-*.patch",
  "kernel/patches/0010-*.patch",
]
precedence = "override"
SPDX-FileCopyrightText = "Jairo Valdivia <valdiviaprado.ing@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = [
  "kernel/patches/0011-*.patch", "kernel/patches/0012-*.patch", "kernel/patches/0013-*.patch",
  "kernel/patches/0014-*.patch", "kernel/patches/0015-*.patch", "kernel/patches/0016-*.patch",
  "kernel/patches/0017-*.patch", "kernel/patches/0018-*.patch", "kernel/patches/0019-*.patch",
  "kernel/patches/0020-*.patch", "kernel/patches/0021-*.patch", "kernel/patches/0022-*.patch",
  "kernel/patches/0023-*.patch", "kernel/patches/0024-*.patch", "kernel/patches/0025-*.patch",
  "kernel/patches/0026-*.patch",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-only"

# iptsd patches. They are changes to iptsd (https://github.com/linux-surface/iptsd) and carry its
# licence: every file they touch is GPL-2.0-or-later there.
[[annotations]]
path = "userspace/iptsd/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# libcamera patches. They are changes to libcamera (https://libcamera.org) and carry the licence
# of each file they touch: LGPL-2.1-or-later for the library and the IPA module sources (also the
# new files of 0002 and 0009), BSD-2-Clause for the debayer shader bayer_unpacked.frag (0002),
# CC0-1.0 for the meson build files (0002, 0009, 0010) and the tuning files 0010 adds.
# "override": the patches contain the SPDX lines of the files they add or quote.
[[annotations]]
path = [
  "userspace/libcamera/0001-*.patch", "userspace/libcamera/0003-*.patch",
  "userspace/libcamera/0004-*.patch", "userspace/libcamera/0005-*.patch",
  "userspace/libcamera/0006-*.patch", "userspace/libcamera/0007-*.patch",
  "userspace/libcamera/0008-*.patch",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "userspace/libcamera/0002-*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-or-later AND BSD-2-Clause AND CC0-1.0"

[[annotations]]
path = "userspace/libcamera/0009-*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-or-later AND CC0-1.0"

[[annotations]]
path = "userspace/libcamera/0010-*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 Joonhoe Kim <26rote@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

# Documentation and reference data: every Markdown file in the tree and everything under docs/.
# Code and commands quoted inside documents may also be used under MIT (see LICENSE).
[[annotations]]
path = ["**/*.md", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Joonhoe Kim"
SPDX-License-Identifier = "CC-BY-SA-4.0"
