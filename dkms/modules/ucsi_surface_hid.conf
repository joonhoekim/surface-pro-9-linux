# USB-C UCSI over SAM HID (linux-surface/kernel#184, not in linux-surface's packages yet).
# ucsi.h is private to drivers/usb/typec/ucsi and describes structures shared with typec_ucsi.ko, so
# the copy always comes from the target kernel's own source. dkms/patches/ucsi-surface-hid-generic.patch
# matches the device in the generic HID group, so the HID core patch 0007 is not needed.
NAME=ucsi_surface_hid
DIR=drivers/usb/typec/ucsi
FILES="drivers/usb/typec/ucsi/ucsi_surface_hid.c drivers/usb/typec/ucsi/ucsi.h"
PATCHES="0008 0019"
DKMS_PATCHES="ucsi-surface-hid-generic.patch"
KBUILD='obj-m := ucsi_surface_hid.o'
# Not in linux-surface (ucsi.h is stock).
LS_PATCHES=""
