# INT3472 discrete camera power: clock frequency from the SSDB. Only the module that contains
# clk_and_regulator.c; intel_skl_int3472_common and _tps68470 stay stock.
NAME=intel_skl_int3472_discrete
DIR=drivers/platform/x86/intel/int3472
FILES="drivers/platform/x86/intel/int3472/discrete.c drivers/platform/x86/intel/int3472/discrete_quirks.c drivers/platform/x86/intel/int3472/clk_and_regulator.c drivers/platform/x86/intel/int3472/led.c"
PATCHES="0015"
KBUILD='obj-m := intel_skl_int3472_discrete.o
intel_skl_int3472_discrete-y := discrete.o discrete_quirks.o clk_and_regulator.o led.o'
# Also changed by linux-surface: 0013-cameras "Add camera support for Surface Pro 9" (discrete.c).
LS_PATCHES="0013-cameras.patch"
