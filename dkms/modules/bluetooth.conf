# bluetooth.ko with LE legacy OOB pairing (0023) and the resolving list fix (0024). Separate
# package (sp9-dkms-bluetooth): the whole core module is rebuilt from the exact kernel version's own
# net/bluetooth, never from another version's copy. Its own Makefile is the Kbuild file without the
# lines for rfcomm, bnep, hidp and 6lowpan, which stay stock.
NAME=bluetooth
PACKAGE=bluetooth
DIR=net/bluetooth
FILES="net/bluetooth/*.c net/bluetooth/*.h"
PATCHES="0023 0024"
KBUILD=@Makefile
KBUILD_DROP='^obj-\$\(CONFIG_BT_[A-Z0-9_]+\)|^bluetooth_6lowpan'
CHECK_CRCS=all
# Not changed by linux-surface.
LS_PATCHES=""
