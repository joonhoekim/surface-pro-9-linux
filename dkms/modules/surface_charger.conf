# AC adapter: return value fix and adapter rating (linux-surface/kernel#184).
NAME=surface_charger
DIR=drivers/power/supply
FILES="drivers/power/supply/surface_charger.c"
PATCHES="0009 0010"
# linux-surface releases from 7.3.5 on read the adapter rating themselves (dptf/adapter_rating_mw).
SUPERSEDED="0010=adapter_rating_mw"
KBUILD='obj-m := surface_charger.o'
# Not changed by linux-surface before 7.3.5; from 7.3.5 on by 0007-surface-sam (has_dptf, adapter rating).
LS_PATCHES="|0007-surface-sam.patch"
