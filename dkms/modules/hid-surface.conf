# Type Cover keys and backlight (hid-surface exists only with linux-surface 0015-hid-surface).
# hid-ids.h is private to drivers/hid. 0017 adds "depends on LEDS_CLASS" to Kconfig: checked in Kbuild.
NAME=hid-surface
DIR=drivers/hid
FILES="drivers/hid/hid-surface.c drivers/hid/hid-ids.h"
PATCHES="0016 0017"
KBUILD='$(if $(CONFIG_LEDS_CLASS),,$(error hid-surface with patch 0017 needs CONFIG_LEDS_CLASS))
obj-m := hid-surface.o'
# The driver itself comes from linux-surface 0015-hid-surface.
LS_PATCHES="0015-hid-surface.patch"
