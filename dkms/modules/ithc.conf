# Touch and pen controller (ithc exists only with linux-surface 0006-ithc). The whole directory,
# with its own Kbuild file.
NAME=ithc
DIR=drivers/hid/ithc
FILES="drivers/hid/ithc/*.c drivers/hid/ithc/*.h"
PATCHES="0018"
KBUILD=@Kbuild
# The driver itself comes from linux-surface 0006-ithc: any change linux-surface makes to it is one
# this module could hide.
LS_PATCHES="0006-ithc.patch"
