# Intel IPU bridge: sensor endpoints for the front OV5693 (non-continuous clock on IPU6) and the
# rear VCM type (dw9800k). 0001-0005 are in mainline v7.4.
NAME=ipu-bridge
DIR=drivers/media/pci/intel
FILES="drivers/media/pci/intel/ipu-bridge.c include/media/ipu-bridge.h"
PATCHES="0001 0002 0003 0004 0005 0011"
UPSTREAM="0001=7.4 0002=7.4 0003=7.4 0004=7.4 0005=7.4"
# include/media/ipu-bridge.h is a public header: when a patch changes it, the copy goes into the
# module's include/ (searched first) and dkms/patches/ipu-bridge-genksyms.patch keeps the symbol
# CRCs of the stock header, so intel-ipu6, intel-ipu7, ipu3-cio2, ivsc-csi and intel_cvs still load
# against it.
PUBLIC_HEADERS="include/media/ipu-bridge.h"
GENKSYMS_PATCH=ipu-bridge-genksyms.patch
CHECK_CRCS="ipu_bridge_init ipu_bridge_parse_ssdb ipu_bridge_instantiate_vcm"
KBUILD='obj-m := ipu-bridge.o'
# Also changed by linux-surface: 0013-cameras "Add camera support for Surface Pro 9", the Surface Pro 8
# and 9 front rotation quirks and the Surface Pro 9 rear rotation fix.
LS_PATCHES="0013-cameras.patch"
